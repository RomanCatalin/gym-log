<div class="bg-workout-background rounded-general pt-4 font-lexend text-white flex flex-col max-h-[85vh] w-[90%] mx-auto overflow-hidden">

  <div class="flex justify-between items-center pb-4 px-4">
    <div class="w-11"></div>
    <div class="text-[28px] uppercase tracking-wide">SPLIT</div>
      <button (click)="toggleDeleteMode()" 
              class="w-11 h-11 rounded-general overflow-hidden flex items-center justify-center shrink-0 transition-transform duration-200"
              style="border-radius: var(--border-radius-general, 12px);"
              [class.bg-workout-delete]="deleteMode" 
              [class.bg-return-button]="!deleteMode"
              [class.scale-115]="deleteMode">
        <ion-icon name="trash-bin-outline" class="text-xl text-white" [class.scale-125]="deleteMode"></ion-icon>
      </button>
  </div>

  <div class="bg-musclegroup-card rounded-general p-3 overflow-y-auto mx-4 mb-4">
    <ion-reorder-group [disabled]="deleteMode" (ionItemReorder)="handleReorder($event)">
      @for (slot of slots; track $index) {
        <ion-item lines="none" class="cycle-slot-item" (click)="onCardTap($index)">
          <ion-reorder class="w-full">
            <div class="bg-return-button rounded-general flex flex-col items-center w-full active:opacity-80 transition-opacity my-1 overflow-hidden">
              <span class="uppercase tracking-wide text-base text-white py-2">{{ getSlotLabel(slot) }}</span>
              <div class="w-full h-1.5 mt-0" [style.background]="getSlotColor(slot)"></div>
            </div>
          </ion-reorder>
        </ion-item>
      }
    </ion-reorder-group>

    @if (slots.length < MAX_SLOTS) {
      <ion-button (click)="addSlot()" class="return-btn rounded-general flex items-center justify-center w-full mt-1" style="--padding-top: 10px; --padding-bottom: 10px;">
        <ion-icon name="add-outline" class="text-2xl text-white"></ion-icon>
      </ion-button>
    }
  </div>


  <div class="flex w-full mt-auto">
    <button (click)="cancel()" class="flex-1 h-12 bg-workout-delete flex items-center justify-center active:opacity-90 transition-opacity rounded-bl-general">
      <ion-icon name="close" class="text-3xl text-white"></ion-icon>
    </button>
    <button (click)="save()" class="flex-1 h-12 bg-workout-finish flex items-center justify-center active:opacity-90 transition-opacity rounded-br-general">
      <ion-icon name="checkmark" class="text-3xl text-white"></ion-icon>
    </button>
  </div>

</div>
