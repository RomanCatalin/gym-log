<ion-content [fullscreen]="true" class="settings-content">
  <div class="p-5 min-h-full bg-main-background pt-general">

    <div class="bg-workout-background rounded-general p-4 pb-10 shadow-md">
      <div class="flex justify-between items-center px-1.5 pt-0.2 pb-7">
        <div class="text-[24px] text-primary font-lexend">
          PREFERENCES
        </div>
        <ion-button (click)="goBack()" class="return-btn">
          <ion-icon name="return-up-back-outline"></ion-icon>
        </ion-button>
      </div>

      <div class="bg-musclegroup-card rounded-general p-4 flex flex-col gap-4 shadow-sm/30">
        <div class="flex justify-between items-center">
          <span class="text-primary font-lexend uppercase tracking-wide">UI Theme</span>
          <div class="bg-return-button rounded-general">
            <ion-select
              [(ngModel)]="preferencesService.theme"
              (ionChange)="onThemeChange($event)"
              interface="popover"
              fill="none"
              [interfaceOptions]="{ cssClass: 'custom-template-popover' }"
              class="bg-return-button text-primary uppercase text-sm tracking-wide outline-none px-4 py-0 font-lexend rounded-general">
              <ion-select-option value="dark">DARK</ion-select-option>
            </ion-select>
          </div>
        </div>
      </div>

      <div class="bg-musclegroup-card rounded-general p-4 mt-4 flex flex-col gap-4 shadow-sm/30">
        <div class="flex justify-between items-center">
          <span class="text-primary font-lexend uppercase tracking-wide">Rest Timer</span>
            <ion-toggle
            [(ngModel)]="preferencesService.alertEnabled"
            (ionChange)="onAlertToggle($event)"
            class="settings-toggle">
          </ion-toggle>

        </div>


        @if (preferencesService.alertEnabled) 
        {    
          <div class="flex justify-between items-center pl-1 mt-2">
          <span class="text-primary/80 font-lexend text-sm uppercase tracking-wide">REST DURATION</span>
            <div class="bg-return-button rounded-general">
              <div class="flex items-center gap-1 bg-return-button rounded-general px-1 py-1">
                <input
                  type="text"
                  inputmode="numeric"
                  [(ngModel)]="restMinutes"
                  (input)="onRestMinutesInput($event)"
                  (blur)="onRestTimeBlur()"
                  placeholder="00"
                  class="bg-set-input-background rounded-general w-10 h-9 outline-none text-center text-primary! font-lexend text-sm" />
                <span class="text-white font-lexend text-sm">:</span>
                <input
                  type="text"
                  inputmode="numeric"
                  [(ngModel)]="restSeconds"
                  (input)="onRestSecondsInput($event)"
                  (blur)="onRestTimeBlur()"
                  placeholder="00"
                  class="bg-set-input-background rounded-general w-10 h-9 outline-none text-center text-primary! font-lexend text-sm" />
              </div>
            </div>
          </div>
          <div class="flex flex-col gap-5 pl-1 mt-2 pb-2">
            <div class="flex justify-between items-center">
              <span class="text-primary/80 font-lexend uppercase text-sm tracking-wide">Sound & Haptics</span>
              <ion-toggle [(ngModel)]="preferencesService.soundEnabled" (ionChange)="onSoundToggle($event)" class="settings-toggle"></ion-toggle>
            </div>           
          </div>
        }
      </div>

      <div class="bg-musclegroup-card rounded-general p-4 mt-4 flex flex-col gap-4 shadow-sm/30">

        <div class="flex justify-between items-center mb-2">
          <span class="text-primary font-lexend uppercase tracking-wide">SET DEFAULTS</span>
        </div>

        <div class="flex flex-col gap-5 pl-1 mt-2 pb-2">
          <div class="flex justify-between items-center">
            <span class="text-primary/80 font-lexend uppercase text-sm tracking-wide">REMEMBER BEST SET</span>
            <ion-toggle [(ngModel)]="preferencesService.bestSetEnabled" (ionChange)="onBestSetToggle($event)" class="settings-toggle"></ion-toggle>
          </div>           
        </div>

        <div class="flex flex-col gap-5 pl-1 mt-2 pb-2">
          <div class="flex justify-between items-center">
            <span class="text-primary/80 font-lexend uppercase text-sm tracking-wide">ENABLE UNILATERAL</span>
            <ion-toggle [(ngModel)]="preferencesService.unilateralEnabled" (ionChange)="onUnilateralToggle($event)" class="settings-toggle"></ion-toggle>
          </div>           
        </div>
        
      </div>

    </div>

  </div>
</ion-content>
