<ion-content [fullscreen]="true" class="settings-content">
  <div class="p-5 min-h-full bg-main-background pt-general">

    <div class="bg-workout-background rounded-general p-4 pb-10 shadow-md">
      <div class="flex justify-between items-center px-1.5 pt-0.2 pb-7">
        <div class="text-[22px] text-primary font-lexend">
          DATA & BACKUP
        </div>
        <ion-button (click)="goBack()" class="return-btn">
          <ion-icon name="return-up-back-outline"></ion-icon>
        </ion-button>
      </div>

      <div class="bg-musclegroup-card rounded-general p-4 flex flex-col gap-4 shadow-sm/30">
        <div class="flex justify-between items-center mb-2">
          <span class="text-primary font-lexend uppercase tracking-wide">AUTOMATIC BACKUP</span>
          <ion-toggle
            [(ngModel)]="preferencesService.dataBackupEnabled"
            (ionChange)="onDataBackupToggle($event)"
            class="settings-toggle">
          </ion-toggle>
        </div>
        <div class="flex gap-0.75 items-stretch">
          <div class="flex-1 bg-[#5A818F] rounded-l-general rounded-r-none flex items-center justify-center shadow-sm/30">
            <ion-button fill="clear" (click)="backupNow()" class="w-full h-full font-lexend text-white font-medium tracking-widest text-sm m-0">
              BACKUP NOW
            </ion-button>
          </div>
          <div class="w-[22%] bg-[#41616d] rounded-r-general rounded-l-none flex items-center justify-center shadow-sm/30">
            <ion-button fill="clear" (click)="share()" class="w-full h-full m-0 text-primary">
              <ion-icon name="share-social-outline" slot="icon-only" class="text-primary text-[20px]"></ion-icon>
            </ion-button>
          </div>
        </div>
      </div>

      <div class="bg-musclegroup-card rounded-general p-4 py-3 flex flex-col gap-4 shadow-sm/30 mt-5">
        <div class="flex justify-between items-center">
          <span class="text-primary font-lexend uppercase tracking-wide">IMPORT DATA</span>
          
          <div class="bg-[#6561aa] rounded-general flex items-center justify-center shadow-sm/30">
            <ion-button fill="clear" (click)="importData()" class="font-lexend text-[14px] font-medium text-primary m-0" style="--color: #ffffff; --ripple-color: #ffffff;">
              IMPORT
            </ion-button>
          </div>

        </div>
      </div>



      <ion-button (click)="confirmClearData()" class="workout-delete-template font-lexend mt-8 flex text-[16px]">
        CLEAR DATA
      </ion-button>
    </div>

  </div>
</ion-content>
